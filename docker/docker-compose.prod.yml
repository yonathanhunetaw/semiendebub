services:
  duka-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.production

    environment:
      APP_ENV: production
      APP_DEBUG: false
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY}
    restart: unless-stopped
    networks:
      - duka-network

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-duka}-nginx
    ports:
      - "${NGINX_PORT:-8096}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - duka-app
    networks:
      - duka-network
    restart: unless-stopped

  duka-minio:
    image: minio/minio
    container_name: ${COMPOSE_PROJECT_NAME:-duka}-minio
    command: server /data --console-address ":9001"
    ports:
      - "9003:9000"   # MinIO API
      - "9004:9001"   # MinIO Console
    networks:
      - duka-network
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_prod_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3


networks:
  duka-network:
    driver: bridge

volumes:
  storage_data:
  vendor_data:
  minio_prod_data:
  db_data: