services:
  duka-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev

    container_name: ${COMPOSE_PROJECT_NAME:-duka}-app

    ports:
      - "${APP_PORT:-8095}:80"
      - "${VITE_PORT:-5177}:5177"

    volumes:
      - ../:/var/www/html:delegated
      - storage_data:/var/www/html/storage
      - vendor_data:/var/www/html/vendor

    environment:
      DB_HOST: duka-db
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY}

    networks:
      - duka-network

    depends_on:
      duka-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-2.0}'
          memory: '${APP_MEM_LIMIT:-1.5G}'
        reservations:
          memory: '${APP_MEM_RESERVATION:-512M}'    

  duka-db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-duka}-db
    restart: unless-stopped
    ports:
      - "${MYSQL_EXPOSE_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-duka}
      MYSQL_USER: ${DB_USERNAME:-duka_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - duka-network
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p${DB_PASSWORD:-password}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-1.0}'
          memory: '${DB_MEM_LIMIT:-1.0G}'
        reservations:
          memory: '${DB_MEM_RESERVATION:-256M}'  

networks:
  duka-network:
    driver: bridge

volumes:
  storage_data:
  vendor_data:
  database_data: