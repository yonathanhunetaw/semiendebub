services:
  duka-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev

    container_name: ${COMPOSE_PROJECT_NAME:-duka}-app

    ports:
      - "${APP_PORT:-8095}:80"
      - "${VITE_PORT:-5177}:5177"

    volumes:
      - ../:/var/www/html:delegated
      - storage_data:/var/www/html/storage
      # The named volume above shadows the whole of storage/, so the seed
      # images committed on the host were invisible inside the container and
      # ItemSeeder could never find one to upload. This more specific mount
      # layers back over it, read-only.
      - ../storage/app/seed-images:/var/www/html/storage/app/seed-images
      - vendor_data:/var/www/html/vendor
      # Read-only Docker socket so /dev/logs can stream other containers' stdout
      # via the Engine API. DEV ONLY: a writable socket is root on the host, and
      # even read-only it exposes the whole daemon — never add this to
      # docker-compose.prod.yml. LogViewerController refuses to run outside
      # local/development, and the root ./logs dir is already visible through
      # the ../:/var/www/html bind mount above.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      DB_HOST: duka-db
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY}

    networks:
      - duka-network

    depends_on:
      duka-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${APP_CPU_LIMIT:-2.0}'
          memory: '${APP_MEM_LIMIT:-3G}'
        reservations:
          memory: '${APP_MEM_RESERVATION:-1G}'    

  duka-db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-duka}-db
    restart: unless-stopped
    ports:
      - "${MYSQL_EXPOSE_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-duka}
      MYSQL_USER: ${DB_USERNAME:-duka_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - duka-network
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p${DB_PASSWORD:-password}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-1.0}'
          memory: '${DB_MEM_LIMIT:-1.0G}'
        reservations:
          memory: '${DB_MEM_RESERVATION:-256M}'  

networks:
  duka-network:
    driver: bridge

volumes:
  storage_data:
  vendor_data:
  database_data: