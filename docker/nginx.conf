server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # 1a. Canvas assets → Cloudflare R2 (more-specific prefix wins over /images/)
    #     Old URLs saved in canvas snapshots look like:
    #       /images/canvas-assets/<filename>
    #     The actual file is on R2 at:
    #       https://pub-c013e92c36c141369a5a6298af8374f6.r2.dev/canvas-assets/<filename>
    location /images/canvas-assets/ {
        # Strip "/images/" prefix so the R2 path becomes /canvas-assets/<filename>
        rewrite ^/images/(.*)$ /$1 break;
        proxy_pass https://pub-c013e92c36c141369a5a6298af8374f6.r2.dev;

        proxy_set_header Host pub-c013e92c36c141369a5a6298af8374f6.r2.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name pub-c013e92c36c141369a5a6298af8374f6.r2.dev;

        proxy_buffering off;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        add_header Cache-Control "public, max-age=86400";

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Content-Length 0;
            return 204;
        }
    }

    # 1b. All other images → MinIO
    location /images/ {
        # Keep the trailing slash
        proxy_pass http://duka-minio:9000/duka-images/;
        
        # IMPORTANT: MinIO requires the host to match the bucket or the internal service name
        proxy_set_header Host duka-minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        add_header Cache-Control "public, max-age=3600";
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Content-Length 0;
            return 204;
        }
    }

    # 2. Proxy everything else to your Laravel application
    location / {
        proxy_pass http://duka-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
